<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>

    <style>
        body {
            background: #ffe6ee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: "Segoe UI", sans-serif;
        }

        /* ===== CARD ===== */
        .card {
            background: white;
            width: 320px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 105, 135, 0.35);
            overflow: hidden;
            text-align: center;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            padding: 35px 0;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
        }

        /* ===== CONTENT ===== */
        .content {
            padding: 25px 20px;
        }

        .name {
            font-size: 24px;
            color: #d6336c;
            margin: 10px 0 5px;
        }

        .title {
            color: #777;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* ===== SKILLS ===== */
        .skills {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .skills li {
            background: #ffe0eb;
            color: #d6336c;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        /* ===== BUTTON ===== */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 10px;
            transition: transform 0.3s, opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="header">
            <img src="avatar.jpg" alt="Avatar của tôi" class="avatar">

        </div>

        <div class="content">
            <h2 class="name">Hoàng Yến Nhi</h2>
            <p class="title">Student / Future Developer</p>

            <p class="description">
                Yêu thích lập trình, chăm chỉ học hỏi  
                và nghe lời sếp
            </p>

            <ul class="skills">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>C++</li>
            </ul>
           <a href="./cmnm.html" class="btn">Liên hệ</a>

         

        </div>
    </div>

</body>
</html>
